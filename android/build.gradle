buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['AndroidSmsRetriever_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

// AGP 9 compiles Kotlin sources itself (built-in Kotlin) and fails if the Kotlin
// Android plugin is applied on top. Apps may opt out with `android.builtInKotlin=false`
// (the React Native 0.87 template does), then the plugin has to be applied here.
// AGP < 9 has no built-in Kotlin at all.
def shouldEnableAgpFallback() {
  def agpMajorVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajorVersion <= 8) {
    return true
  }

  def propertyVal = providers.gradleProperty("android.builtInKotlin").orNull
  def isBuiltInKotlinEnabled = propertyVal != null ? propertyVal.toBoolean() : true

  return !isBuiltInKotlinEnabled
}

apply plugin: "com.android.library"

if (shouldEnableAgpFallback()) {
  apply plugin: 'kotlin-android'
}

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AndroidSmsRetriever_" + name]).toInteger()
}

android {
  namespace "com.androidsmsretriever"

  compileSdk getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
    targetSdk getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "com.google.android.gms:play-services-auth:21.2.0"
  implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
}

react {
  jsRootDir = file("../src/")
  libraryName = "AndroidSmsRetriever"
  codegenJavaPackageName = "com.androidsmsretriever"
}
